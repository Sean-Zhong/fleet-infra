---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memos-tls
  namespace: memos
spec:
  secretName: memos-tls-secret
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
  - memos.seanzhong.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos
  namespace: memos
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`memos.seanzhong.com`)
      kind: Rule
      services:
        - name: memos
          port: 5230
  tls:
    secretName: memos-tls-secret

